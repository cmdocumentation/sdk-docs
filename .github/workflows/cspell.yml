name: cspell (spellcheck)
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: streetsidesoftware/cspell-action@v8
        with:
          # check changed files only on PRs, or all files on push
          incremental_files_only: true
          config: '.'
          # 'warning' makes annotations non-blocking; use 'error' to fail inline
          inline: warning
          # fail the job when issues found
          strict: true
